[project]
name = "talon-computer-use-agents-sdk"
version = "0.1.0"
description = "Bridging natural language dictation to OS control."
authors = [{ name = "VibeCodingLabs" }]
dependencies = [
    "pydantic>=2.0.0",
    "instructor>=1.0.0",
    "openai>=1.0.0",
    "typer>=0.12.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
